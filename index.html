<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CAM - Prueba de Iframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0910; color: white; font-family: sans-serif; }
        #bgMosaic { position: fixed; inset: 0; z-index: -2; background-color: #0B0910; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-gray-800 p-4 flex justify-between items-center bg-[#0B0910] z-50">
        <h1 onclick="irAInicio()" class="text-pink-500 font-black text-2xl cursor-pointer">NEXUS CAM</h1>
        <button onclick="irADetalle()" class="bg-pink-600 px-4 py-2 rounded text-white font-bold">Probar Sala Fija</button>
    </header>

    <main id="vista-inicio" class="max-w-7xl mx-auto p-8 flex-grow w-full">
        <h2 class="text-2xl font-bold mb-4">Haz clic en "Probar Sala Fija" arriba para ver si el iframe carga.</h2>
        <p class="text-gray-400">Si la sala carga, el problema es la generación dinámica de la URL. Si no carga, Chaturbate está bloqueando tu dominio de Vercel.</p>
    </main>

    <main id="vista-detalle" class="max-w-7xl mx-auto p-4 md:p-8 hidden relative z-10 flex-grow w-full">
        <button onclick="irAInicio()" class="text-gray-400 hover:text-white mb-6 flex items-center gap-2 text-sm font-bold bg-[#16121d] px-4 py-2 rounded border border-gray-700">
            <i class="fas fa-arrow-left"></i> VOLVER
        </button>

        <div class="relative w-full rounded-3xl overflow-hidden bg-black border border-gray-800 shadow-2xl" style="aspect-ratio: 16 / 9;">
            <div id="contenedor-video" class="absolute inset-0 flex items-center justify-center text-gray-500">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin text-4xl mb-4 text-[#FF0055]"></i>
                    <p class="font-bold tracking-widest">CARGANDO SALA FIJA...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const MI_WM = 'q7k3D';
        // NOMBRE FIJO PARA LA PRUEBA
        const MODELO_FIJA = 'sabrina_geek'; 

        function irADetalle() {
            document.getElementById('vista-inicio').classList.add('hidden');
            document.getElementById('vista-detalle').classList.remove('hidden');
            
            const contenedorVideo = document.getElementById('contenedor-video');
            
            // URL LIMPIA Y FIJA
            const urlVideo = `https://chaturbate.com/embed/${MODELO_FIJA}/?campaign=${MI_WM}`;
            
            contenedorVideo.innerHTML = `
                <iframe src="${urlVideo}" 
                        class="absolute inset-0 w-full h-full border-none" 
                        allowfullscreen>
                </iframe>
            `;
        }

        function irAInicio() {
            document.getElementById('vista-detalle').classList.add('hidden');
            document.getElementById('vista-inicio').classList.remove('hidden');
            document.getElementById('contenedor-video').innerHTML = '';
        }
    </script>
</body>
</html>
